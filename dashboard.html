<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard | MindSpark Academy</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="dash-shell">
    <div class="dash-backdrop" id="dash-backdrop"></div>

    <!-- Sidebar -->
    <aside class="dash-sidebar" id="dash-sidebar" aria-label="Dashboard Navigation">
      <div class="d-flex align-items-center justify-content-between mb-4 px-2">
        <a href="index.html" class="ms-logo-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="36" height="36" fill="none">
            <rect width="64" height="64" rx="16" fill="#5736A8"/>
            <rect x="12" y="14" width="40" height="36" rx="8" stroke="#FFC83D" stroke-width="3.5"/>
            <circle cx="24" cy="26" r="5" fill="#FFC83D"/>
            <circle cx="38" cy="26" r="5" fill="#FF786B"/>
            <circle cx="30" cy="38" r="5" fill="#E8F5FF"/>
          </svg>
          <div>
            <div class="fw-black display-font" style="font-size:1.05rem;">MINDSPARK</div>
            <div class="text-coral fw-bold" style="font-size:0.65rem;letter-spacing:0.1em;">PARENT PORTAL</div>
          </div>
        </a>
        <button type="button" class="ms-icon-btn d-lg-none" id="dash-close-sidebar" aria-label="Close Sidebar">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>

      <div class="mb-3 px-2">
        <span class="badge-demo w-100 justify-content-center">Demo Mode • localStorage</span>
      </div>

      <nav class="flex-fill" id="dash-nav-list">
        <button type="button" class="dash-nav-btn active" data-tab="overview"><i data-lucide="layout-dashboard" style="width:18px;height:18px;"></i><span>1. Overview</span></button>
        <button type="button" class="dash-nav-btn" data-tab="children"><i data-lucide="users" style="width:18px;height:18px;"></i><span>2. My Children</span></button>
        <button type="button" class="dash-nav-btn" data-tab="enroll"><i data-lucide="book-open-check" style="width:18px;height:18px;"></i><span>3. Enroll in Programs</span></button>
        <button type="button" class="dash-nav-btn" data-tab="progress"><i data-lucide="trending-up" style="width:18px;height:18px;"></i><span>4. Learning Progress</span></button>
        <button type="button" class="dash-nav-btn" data-tab="schedule"><i data-lucide="calendar" style="width:18px;height:18px;"></i><span>5. Class Schedule</span></button>
        <button type="button" class="dash-nav-btn" data-tab="competitions"><i data-lucide="trophy" style="width:18px;height:18px;"></i><span>6. Competitions</span></button>
        <button type="button" class="dash-nav-btn" data-tab="payments"><i data-lucide="receipt" style="width:18px;height:18px;"></i><span>7. Fee Payments</span></button>
        <button type="button" class="dash-nav-btn" data-tab="notifications"><i data-lucide="bell" style="width:18px;height:18px;"></i><span>8. Notifications</span></button>
        <button type="button" class="dash-nav-btn" data-tab="profile"><i data-lucide="user-cog" style="width:18px;height:18px;"></i><span>9. My Profile</span></button>
      </nav>

      <div class="pt-3 border-top">
        <button type="button" id="dash-logout-btn" class="dash-nav-btn text-danger">
          <i data-lucide="log-out" style="width:18px;height:18px;"></i>
          <span>10. Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="dash-main">
      <header class="dash-topbar">
        <div class="d-flex align-items-center gap-3">
          <button type="button" class="ms-icon-btn d-lg-none" id="dash-open-sidebar" aria-label="Open Sidebar">
            <i data-lucide="menu" style="width:20px;height:20px;"></i>
          </button>
          <div>
            <h5 class="mb-0 fw-bold display-font" id="dash-page-title">Overview</h5>
            <div class="small text-muted-ms d-none d-sm-block">Sample Parent Analytics &amp; Demo Records</div>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button type="button" class="ms-icon-btn position-relative" id="dash-notif-shortcut" title="Notifications">
            <i data-lucide="bell" style="width:18px;height:18px;"></i>
            <span id="dash-unread-dot" class="position-absolute top-0 end-0 translate-middle badge rounded-pill bg-danger" style="font-size:0.65rem;">0</span>
          </button>
          <button type="button" class="ms-icon-btn" data-theme-toggle onclick="toggleMindSparkTheme()" title="Toggle Theme">
            <i data-lucide="moon" style="width:18px;height:18px;"></i>
          </button>
          <button type="button" class="ms-icon-btn" onclick="toggleMindSparkDir()" title="Switch LTR / RTL">
            <span data-dir-label>RTL</span>
          </button>
          <button type="button" class="d-flex align-items-center gap-2 border rounded-pill px-2 py-1 bg-transparent" id="dash-profile-shortcut" style="border-color:var(--border-color)!important;">
            <img src="assets/images/avatar-parent.svg" alt="Parent Profile" width="30" height="30" class="rounded-circle">
            <span class="small fw-bold d-none d-md-inline" id="dash-topbar-name">Parent</span>
          </button>
        </div>
      </header>

      <main class="dash-content" id="dash-module-host"></main>
    </div>
  </div>

  <!-- Shared Dashboard Modal -->
  <div class="modal fade" id="dashModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0" style="background:var(--bg-surface);color:var(--text-primary);">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold display-font" id="dash-modal-title">Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="dash-modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>
